name: Bug report
description: Something in Tab Workspaces does not work as expected.
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Issues in this repository are public. Do not include page URLs, tab titles, passwords or personal data.
        The fastest route is **Settings > Privacy > Report a bug** inside the extension, which redacts the data for you.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A short numbered list is enough.
      placeholder: |
        1. Open the dashboard
        2. Create a group
        3. ...
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown in the extension details at chrome://extensions.
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 155 on Windows 11
    validations:
      required: false
