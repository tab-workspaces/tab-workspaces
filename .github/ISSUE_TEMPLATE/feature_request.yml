name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Issues in this repository are public. Do not include page URLs, tab titles, passwords or personal data.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the situation or workflow that is hard today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: Describe the change you have in mind. Alternatives you considered are welcome.
    validations:
      required: false
